<meta charset="utf-8">
<title>Thumbfall</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,700;1,700&display=swap">
<style>
/* Layout: one landscape stage (#root) that is CSS-rotated when the viewport is portrait; canvas playfield + DOM overlays.
   Palette follows the track's cover art: cold steel blue with a warm tungsten glow. */
:root{
  --bg:#06070c; --panel:#0f121b; --panel2:#161a27; --line:#262c3d; --ink:#eef1fa; --dim:#8a91a8;
  --perfect:#ffe2a0; --good:#6ef0c6; --ok:#7fa8ff; --miss:#ff4d6a; --accent:#8fd8ff; --warm:#ffab5c;
  --disp:'Chakra Petch','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--disp)}
#root{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#pauseBtn{position:absolute;top:10px;right:14px;width:42px;height:34px;border:1px solid var(--line);border-radius:6px;background:rgba(15,18,27,.72);
  color:var(--ink);font:700 13px var(--disp);letter-spacing:.12em}
.ov{position:absolute;inset:0;display:flex;background:rgba(6,7,12,.88);overflow:auto;padding:12px 20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#menu{background:linear-gradient(100deg,rgba(6,7,12,.97) 30%,rgba(6,7,12,.82)),var(--bg)}
.wrap{margin:auto;width:100%;max-width:880px;display:grid;grid-template-columns:1fr 1fr;gap:12px 26px;align-items:center}
.wrap>*{min-width:0}
.brand{font:italic 700 15px/1 var(--disp);letter-spacing:.34em;color:var(--dim);margin:0 0 8px}
.brand b{color:var(--accent)}
.brand span{font-style:normal;letter-spacing:.04em;font-size:11px;margin-left:10px;color:var(--dim);font-weight:500}
.songs{display:flex;flex-direction:column;gap:5px}
.sg{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;padding:5px 10px 5px 5px;background:var(--panel);border:1px solid var(--line);color:var(--ink);font-family:var(--disp);border-radius:3px;min-width:0}
.sg.on{border-color:var(--warm);background:linear-gradient(90deg,rgba(255,171,92,.16),var(--panel) 70%);box-shadow:inset 3px 0 0 var(--warm)}
.sg .art{width:36px;height:36px;object-fit:cover;display:grid;place-items:center;font:italic 700 15px var(--disp);color:#06070c;border-radius:2px}
.sg .tt{min-width:0}
.sg .tt b{display:block;font:italic 700 16px/1.15 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg .tt small{font:500 10.5px var(--disp);color:var(--dim);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.sg .rt{text-align:right;font:700 10px var(--disp);letter-spacing:.08em;color:var(--dim);font-variant-numeric:tabular-nums}
.sg .rt i{display:inline-block;font-style:normal;padding:1px 6px;background:var(--miss);color:#fff;margin-bottom:3px}
.sg .rt em{font-style:normal;color:var(--perfect)}
.song{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.cover{width:clamp(92px,26vmin,132px);aspect-ratio:1;object-fit:cover;border:1px solid var(--line);box-shadow:0 0 0 4px #0b0d14,0 12px 40px rgba(255,171,92,.18);background:var(--panel)}
.song h1{font:italic 700 clamp(24px,5vmax,40px)/1.02 var(--disp);margin:0;letter-spacing:.01em;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:3px 8px;border:1px solid var(--line);font:700 11px var(--disp);letter-spacing:.1em;color:var(--dim);font-variant-numeric:tabular-nums}
.chip.lv{background:var(--miss);border-color:var(--miss);color:#fff}
.best{margin-top:10px;font:700 12px var(--disp);color:var(--dim);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.best b{color:var(--perfect);font-size:15px}
.how{color:var(--dim);font-size:12px;line-height:1.6;margin:12px 0 0}
.how i{font-style:normal;color:var(--ink)}
h2{font:italic 700 28px/1 var(--disp);margin:0 0 4px;letter-spacing:.06em}
.sub{color:var(--dim);font-size:12px;line-height:1.6;margin:6px 0 0}
.set{display:flex;flex-direction:column;gap:7px}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:6px 8px 6px 12px;background:var(--panel);border:1px solid var(--line)}
.row label{font-size:11px;color:var(--dim);line-height:1.35}
.row label b{display:block;color:var(--ink);font-size:14px;font-weight:700}
.step{display:flex;align-items:center;gap:4px}
.step output{min-width:62px;text-align:center;font:700 17px var(--disp);font-variant-numeric:tabular-nums}
.sb{width:38px;height:36px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:700 19px var(--disp);border-radius:4px}
.sb:active{background:var(--accent);color:#000}
.tg{min-width:74px;height:36px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);font:700 13px var(--disp);border-radius:4px;letter-spacing:.1em}
.tg.on{background:var(--good);color:#04130d;border-color:var(--good)}
.go{height:50px;border:0;background:var(--ink);color:#06070c;font:italic 700 21px var(--disp);letter-spacing:.16em;border-radius:4px;position:relative;overflow:hidden}
.go:not(:disabled):active{background:var(--warm)}
.go:disabled{background:#232838;color:var(--dim);font-size:14px;letter-spacing:.04em;font-style:normal}
.go.alt{background:transparent;color:var(--ink);border:1px solid var(--line);height:42px;font-size:15px}
#count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:italic 700 110px var(--disp);color:var(--ink);pointer-events:none;text-shadow:0 0 30px rgba(143,216,255,.6)}
.res{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.rank{font:italic 700 clamp(72px,24vmin,124px)/.9 var(--disp);color:var(--perfect);text-shadow:0 0 44px rgba(255,226,160,.4)}
.score{font:700 32px var(--disp);font-variant-numeric:tabular-nums;letter-spacing:.05em}
.acc{font:700 13px var(--disp);color:var(--dim);letter-spacing:.1em;font-variant-numeric:tabular-nums}
.tag{display:inline-block;margin-top:6px;padding:2px 10px;border:1px solid var(--perfect);color:var(--perfect);font:700 12px var(--disp);letter-spacing:.16em}
.tag.new{border-color:var(--warm);color:var(--warm)}
.jt{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;font:700 15px var(--disp);font-variant-numeric:tabular-nums;padding:10px 14px;background:var(--panel);border:1px solid var(--line)}
.jt .n{letter-spacing:.1em}
.jt .bar{height:5px;background:var(--panel2);position:relative}
.jt .bar i{position:absolute;inset:0 auto 0 0;background:currentColor}
.jt .s{color:var(--dim);font-weight:500;font-size:12px;grid-column:1/3}
.jt .sv{color:var(--dim);font-weight:500;font-size:12px;text-align:right}
@media (max-height:350px){.how{display:none}.row{padding-block:4px}}
</style>

<div id="root">
  <canvas id="cv"></canvas>
  <button id="pauseBtn" type="button" aria-label="일시정지" hidden>II</button>

  <section id="menu" class="ov">
    <div class="wrap">
      <div class="left">
        <p class="brand">THUMB<b>FALL</b> <span>곡을 고르세요</span></p>
        <div class="songs" id="songs"></div>
      </div>
      <div class="set">
        <div class="row"><label><b>노트 속도</b>높을수록 빨리 내려옴</label>
          <div class="step"><button class="sb" data-k="speed" data-d="-0.5" type="button">−</button><output data-o="speed"></output><button class="sb" data-k="speed" data-d="0.5" type="button">+</button></div></div>
        <div class="row"><label><b>경사</b>0은 평면, 높을수록 멀리서 좁게</label>
          <div class="step"><button class="sb" data-k="tilt" data-d="-1" type="button">−</button><output data-o="tilt"></output><button class="sb" data-k="tilt" data-d="1" type="button">+</button></div></div>
        <div class="row"><label><b>판정 오프셋</b>노트가 빨리 오면 +, 늦게 오면 −</label>
          <div class="step"><button class="sb" data-k="offset" data-d="-5" type="button">−</button><output data-o="offset"></output><button class="sb" data-k="offset" data-d="5" type="button">+</button></div></div>
        <div class="row"><label><b>오토플레이</b>채보 감상 · 오프셋 맞추기용</label>
          <button class="tg" id="autoBtn" type="button">OFF</button></div>
        <button class="go" id="startBtn" type="button">START</button>
      </div>
    </div>
  </section>

  <section id="pause" class="ov" hidden>
    <div class="wrap">
      <div><h2>PAUSED</h2><p class="sub">설정을 바꾼 뒤 이어서 할 수 있어요.</p>
        <div class="set" style="margin-top:10px">
          <div class="row"><label><b>노트 속도</b></label>
            <div class="step"><button class="sb" data-k="speed" data-d="-0.5" type="button">−</button><output data-o="speed"></output><button class="sb" data-k="speed" data-d="0.5" type="button">+</button></div></div>
          <div class="row"><label><b>경사</b></label>
            <div class="step"><button class="sb" data-k="tilt" data-d="-1" type="button">−</button><output data-o="tilt"></output><button class="sb" data-k="tilt" data-d="1" type="button">+</button></div></div>
          <div class="row"><label><b>판정 오프셋</b></label>
            <div class="step"><button class="sb" data-k="offset" data-d="-5" type="button">−</button><output data-o="offset"></output><button class="sb" data-k="offset" data-d="5" type="button">+</button></div></div>
        </div></div>
      <div class="set">
        <button class="go" id="resumeBtn" type="button">RESUME</button>
        <button class="go alt" id="retryBtn" type="button">처음부터</button>
        <button class="go alt" id="quitBtn" type="button">메뉴로</button>
      </div>
    </div>
  </section>

  <section id="result" class="ov" hidden>
    <div class="wrap">
      <div class="res">
        <div class="rank" id="rRank">S</div>
        <div class="score" id="rScore">0</div>
        <div class="acc" id="rAcc"></div>
        <div id="rTag"></div>
      </div>
      <div class="set">
        <div class="jt" id="rTable"></div>
        <button class="go" id="againBtn" type="button">RETRY</button>
        <button class="go alt" id="menuBtn" type="button">메뉴로</button>
      </div>
    </div>
  </section>
  <div id="count" hidden></div>
</div>
