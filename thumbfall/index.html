<title>Thumbfall</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,700;1,700&display=swap">
<style>
/* Layout: one landscape stage (#root) that is CSS-rotated when the viewport is portrait; canvas playfield + DOM overlays */
:root{
  --bg:#07080d; --panel:#10131c; --line:#262b3b; --ink:#eef1fa; --dim:#8a91a8;
  --perfect:#ffe7a0; --good:#6ef0c6; --ok:#7fa8ff; --miss:#ff4d6a; --accent:#8fd8ff;
  --disp:'Chakra Petch','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--disp)}
#root{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#pauseBtn{position:absolute;top:10px;right:14px;width:44px;height:36px;border:1px solid var(--line);border-radius:6px;background:rgba(16,19,28,.7);
  color:var(--ink);font:700 14px var(--disp);letter-spacing:.1em}
.ov{position:absolute;inset:0;display:flex;background:rgba(7,8,13,.9);overflow:auto;padding:14px 20px}
.wrap{margin:auto;width:100%;max-width:820px;display:grid;grid-template-columns:1.1fr 1fr;gap:18px 34px;align-items:center}
.wrap.one{grid-template-columns:1fr;max-width:420px}
h1{font:italic 700 clamp(34px,7vmax,58px)/1 var(--disp);margin:0;letter-spacing:.02em}
h1 span{color:var(--accent)}
h2{font:italic 700 30px/1 var(--disp);margin:0 0 4px;letter-spacing:.04em}
.sub{color:var(--dim);font-size:13px;line-height:1.6;margin:8px 0 0}
.track{margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--panel)}
.track b{display:block;font:700 19px var(--disp);letter-spacing:.03em}
.track small{color:var(--dim);font-size:12px;letter-spacing:.06em}
.lv{display:inline-block;margin-top:8px;padding:2px 8px;background:var(--miss);color:#fff;font:700 12px var(--disp);letter-spacing:.12em}
.set{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border:1px solid var(--line)}
.row label{font-size:13px;color:var(--dim)}
.row label b{display:block;color:var(--ink);font-size:14px;font-weight:700}
.step{display:flex;align-items:center;gap:6px}
.step output{min-width:66px;text-align:center;font:700 17px var(--disp);font-variant-numeric:tabular-nums}
.sb{width:40px;height:40px;border:1px solid var(--line);background:#161a26;color:var(--ink);font:700 20px var(--disp);border-radius:4px}
.sb:active{background:var(--accent);color:#000}
.tg{min-width:74px;height:40px;border:1px solid var(--line);background:#161a26;color:var(--dim);font:700 14px var(--disp);border-radius:4px;letter-spacing:.08em}
.tg.on{background:var(--good);color:#04130d;border-color:var(--good)}
.go{height:54px;border:0;background:var(--ink);color:#07080d;font:italic 700 22px var(--disp);letter-spacing:.14em;border-radius:4px}
.go:disabled{background:#2a2f3f;color:var(--dim);font-size:15px;letter-spacing:.04em;font-style:normal}
.go.alt{background:transparent;color:var(--ink);border:1px solid var(--line);height:46px;font-size:16px}
.best{font-size:12px;color:var(--dim);letter-spacing:.06em;font-variant-numeric:tabular-nums}
#count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:italic 700 110px var(--disp);color:var(--ink);pointer-events:none;text-shadow:0 0 30px rgba(143,216,255,.6)}
.rank{font:italic 700 clamp(80px,22vmin,130px)/.9 var(--disp);color:var(--perfect);text-shadow:0 0 40px rgba(255,231,160,.35)}
.score{font:700 34px var(--disp);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.tag{display:inline-block;margin-top:6px;padding:2px 10px;border:1px solid var(--perfect);color:var(--perfect);font:700 12px var(--disp);letter-spacing:.16em}
.jt{display:grid;grid-template-columns:1fr auto;gap:5px 18px;font:700 16px var(--disp);font-variant-numeric:tabular-nums;padding:12px 14px;background:var(--panel);border:1px solid var(--line)}
.jt span:nth-child(odd){letter-spacing:.1em}
.jt .s{color:var(--dim);font-weight:500;font-size:13px}
@media (max-height:340px){.sub{display:none}}
</style>

<div id="root">
  <canvas id="cv"></canvas>
  <button id="pauseBtn" type="button" aria-label="일시정지" hidden>II</button>

  <section id="menu" class="ov">
    <div class="wrap">
      <div>
        <h1>THUMB<span>FALL</span></h1>
        <p class="sub">엄지 두 개로 치는 무레인 리듬게임. 폰을 가로로 잡고, 노트가 판정선에 닿는 순간 그 위치를 누르세요. 긴 노트는 끝까지 누르고, 휘어지는 노트는 손가락으로 따라가세요.</p>
        <div class="track">
          <b>Indigo Overdrive</b>

          <span class="lv">EXTREME 14</span>
          <div class="best" id="best"></div>
        </div>
      </div>
      <div class="set">
        <div class="row"><label for="spdV"><b>노트 속도</b>높을수록 빨리 내려옴</label>
          <div class="step"><button class="sb" data-k="speed" data-d="-0.5" type="button">−</button><output id="spdV"></output><button class="sb" data-k="speed" data-d="0.5" type="button">+</button></div></div>
        <div class="row"><label for="offV"><b>판정 오프셋</b>노트가 빨리 오면 +, 늦게 오면 −</label>
          <div class="step"><button class="sb" data-k="offset" data-d="-5" type="button">−</button><output id="offV"></output><button class="sb" data-k="offset" data-d="5" type="button">+</button></div></div>
        <div class="row"><label><b>오토플레이</b>채보 감상용</label>
          <button class="tg" id="autoBtn" type="button">OFF</button></div>
        <button class="go" id="startBtn" type="button" disabled>곡 합성 중… 0%</button>
      </div>
    </div>
  </section>

  <section id="pause" class="ov" hidden>
    <div class="wrap">
      <div><h2>PAUSED</h2><p class="sub">속도와 오프셋은 여기서도 바꿀 수 있어요.</p>
        <div class="set" style="margin-top:12px">
          <div class="row"><label><b>노트 속도</b></label>
            <div class="step"><button class="sb" data-k="speed" data-d="-0.5" type="button">−</button><output id="spdV2"></output><button class="sb" data-k="speed" data-d="0.5" type="button">+</button></div></div>
          <div class="row"><label><b>판정 오프셋</b></label>
            <div class="step"><button class="sb" data-k="offset" data-d="-5" type="button">−</button><output id="offV2"></output><button class="sb" data-k="offset" data-d="5" type="button">+</button></div></div>
        </div></div>
      <div class="set">
        <button class="go" id="resumeBtn" type="button">RESUME</button>
        <button class="go alt" id="retryBtn" type="button">처음부터</button>
        <button class="go alt" id="quitBtn" type="button">메뉴로</button>
      </div>
    </div>
  </section>

  <section id="result" class="ov" hidden>
    <div class="wrap">
      <div style="text-align:center">
        <div class="rank" id="rRank">S</div>
        <div class="score" id="rScore">0</div>
        <div id="rTag"></div>
      </div>
      <div class="set">
        <div class="jt" id="rTable"></div>
        <button class="go" id="againBtn" type="button">RETRY</button>
        <button class="go alt" id="menuBtn" type="button">메뉴로</button>
      </div>
    </div>
  </section>
  <div id="count" hidden></div>
</div>

<script>
(() => {

B({p:'a.......e.......',c:['4.......b.......']});

// --- Build-up (16-19): snare roll
B({c:['3...4...3...4...','c...b...c...b...']});

// --- Drop 1 (20-35)
B({m:'a-.a.c.e-.d.c.a.',c:['3..b.4.c..3.b.4.','c...........4...']});
B({m:'f-.f.d.c-.a.c.d.',c:['c..4.b.3..c.4.b.','3...........c...']});

B({m:'f-.f.d.c-.acdfdc',c:['3..c.4.b..3c4b5a','c...............']});

B({m:'f-.f.d.c-.acdfdc',c:['c4b3a2b3..c4b3a2']});
B({m:'c-.c.e.g-.e.c.9.',c:['3.4.5.4.3.4.5.6.','c.b.a.b.c.d.c.b.']});
B({m:'d.d.b.b.9.9.9bdg',c:['c.c.4.4.b.b.3b5d','3...b...4.......']});
B({m:'aceacehecaecaeca',c:['3b4c5d6e5d4c3b2a']});
B({m:'8acf8acfcfa8cfa8',c:['c4b3c4b3a2b3c4d5']});
B({m:'ceg-gec.ceg-j.g.',c:['3b4.c5d.4c5.e.c.','............3.4.']});
B({m:'gdb9gdb9bdgbdgi.',c:['d4c3b5a6b4c5d6e.']});
B({m:'aceacehecaecaeca',c:['33bb44cc55dd44cc']});
B({m:'8acf8acfcfa8cfa8',c:['44cc33bb44cc3b4c']});
B({m:'cegjgecegjgecgcj',h:[[0,7,3],[8,7,12]],c:['..b.cc....4.33.2']});
B({m:'gdb9gdb9g.g.gggg',c:['d4c3b5a63.4.3c3c','........c.b.....']});
// --- Bridge (68-75): half-time bass stabs
B({c:['3..4..5...4.3...','c..b..a...b.c...']});
B({c:['3.b4..c.3..b..4.','c.......b.......']});
B({s:[[0,[[0,3],[3,6],[6,3],[10,6],[12,3],[15,5]]]],c:['...c..b...c.d...']});

B({p:'a.......e.......',c:['3.......b.......','c...............']});

/* =====================================================================
   CHART
   ===================================================================== */
const NW = 3; // note width in field units (field is 16 wide)
const cx = p => Math.max(NW / 2 + 0.1, Math.min(16 - NW / 2 - 0.1, p + 0.5));
const notes = [];
