<title>카트 대발사 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@500;700;800&display=swap">
<style>
/* Layout: one full-bleed WebGL stage; HUD chips pinned to the corners, a launch meter at the bottom, touch skill pads at the sides. */
:root {
  --ink: #1d1626;          /* outlines, text on light chips */
  --paper: #fff7e8;        /* chip and card ground */
  --red: #ef4a32;          /* the cart's handle red, launch and boost */
  --teal: #13a493;         /* leap, success */
  --sky: #2f8fd8;          /* dash */
  --violet: #8a4dff;       /* dive */
  --gold: #ffc93a;         /* gold, perfect window */
  --fire: #ff8a1f;         /* phoenix */
  --display: 'Black Han Sans', 'Gothic A1', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --body: 'Gothic A1', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: #0d1a2b; color: var(--paper); font-family: var(--body); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }
.hud { position: fixed; pointer-events: none; z-index: 2; }
#tl { top: calc(10px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 2px; }
#dist { font: 40px/1 var(--display); color: #fff; -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 rgba(29,22,38,.55); font-variant-numeric: tabular-nums; }
#sub { font: 700 13px var(--body); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.7); font-variant-numeric: tabular-nums; }
#tc { top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); text-align: center; }
#zone { font: 22px var(--display); color: #fff; -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; letter-spacing: .02em; }
#gold { font: 26px var(--display); color: var(--gold); -webkit-text-stroke: 1.2px var(--ink); paint-order: stroke fill; font-variant-numeric: tabular-nums; }
#tr { top: calc(10px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 6px; pointer-events: auto; }
.pill { border: 2px solid var(--ink); background: var(--paper); color: var(--ink); border-radius: 999px; padding: 6px 12px; font: 15px var(--display); box-shadow: 0 3px 0 var(--ink); cursor: pointer; }
.pill:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.pill:focus-visible, .pad:focus-visible, .go:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#toast { position: fixed; left: 50%; top: 32%; transform: translate(-50%, -50%); font: 34px var(--display); color: #fff; -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; text-align: center; pointer-events: none; z-index: 3; opacity: 0; transition: opacity .25s; white-space: nowrap; }
#toast.on { opacity: 1; }
#meter { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(460px, 70vw); z-index: 2; pointer-events: none; }
#meter .bar { height: 22px; border: 3px solid var(--ink); border-radius: 12px; background: #3b3250; overflow: hidden; position: relative; box-shadow: 0 4px 0 var(--ink); }
#meter .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #ff6a3a, var(--gold)); }
#meter .win { position: absolute; top: 0; bottom: 0; right: 0; background: rgba(255,255,255,.35); border-left: 2px dashed #fff; }
#meter .lbl { text-align: center; font: 15px var(--display); margin-bottom: 6px; color: #fff; -webkit-text-stroke: .8px var(--ink); paint-order: stroke fill; }
#fuel { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(300px, 40vw); height: 14px; border: 3px solid var(--ink); border-radius: 10px; background: #3b3250; z-index: 2; overflow: hidden; }
#fuel i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #c9262c, #ff6a3a); }
#fuel b { position: absolute; inset: -1px auto -1px 0; background: linear-gradient(180deg, #fff3b0, #ffc21f 50%, #ff9a00); border-right: 2px solid var(--ink); }
.pad { position: fixed; z-index: 2; border: 3px solid var(--ink); border-radius: 50%; color: #fff; font: 16px/1.1 var(--display); box-shadow: 0 5px 0 var(--ink); display: grid; place-items: center; text-align: center; touch-action: none; cursor: pointer; }
.pad small { display: block; font: 800 11px var(--body); opacity: .9; }
.pad.down { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.pad:disabled { opacity: .4; }
.pad.fire { box-shadow: 0 0 0 3px var(--fire), 0 0 18px 4px rgba(255,138,31,.7); }
#bBoost { right: max(18px, env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); width: 96px; height: 96px; background: var(--red); }
#bDive { right: max(30px, env(safe-area-inset-right, 0px)); bottom: calc(130px + env(safe-area-inset-bottom, 0px)); width: 68px; height: 68px; background: var(--violet); }
#bLeap { left: max(18px, env(safe-area-inset-left, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); width: 88px; height: 88px; background: var(--teal); }
#bDash { left: max(28px, env(safe-area-inset-left, 0px)); bottom: calc(122px + env(safe-area-inset-bottom, 0px)); width: 68px; height: 68px; background: var(--sky); }
#bSphx { left: max(112px, env(safe-area-inset-left, 0px)); bottom: calc(128px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; background: linear-gradient(160deg, #ffb23a, #e2541a); font-size: 13px; }
.kb .pad::after { content: attr(data-key); position: absolute; top: -8px; right: -4px; background: var(--ink); color: #fff; font: 700 11px sans-serif; padding: 2px 7px; border-radius: 9px; }
.card { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(480px, calc(100vw - 32px)); max-height: calc(100% - 32px); overflow: auto; background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 8px 0 var(--ink); padding: 18px 20px; z-index: 4; display: grid; gap: 12px; }
.card h1, .card h2 { margin: 0; font-family: var(--display); font-weight: 400; text-wrap: balance; }
.card h1 { font-size: 34px; color: var(--red); line-height: 1.05; }
.card h2 { font-size: 30px; line-height: 1.05; }
.card p { margin: 0; line-height: 1.55; font-size: 14px; }
.rows { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; font-variant-numeric: tabular-nums; }
.rows b { text-align: right; }
.rows .tot { color: var(--red); font: 20px var(--display); }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.go { height: 50px; border: 3px solid var(--ink); border-radius: 12px; background: var(--red); color: #fff; font: 20px var(--display); box-shadow: 0 5px 0 var(--ink); cursor: pointer; }
.go.alt { background: var(--teal); }
.go:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.presets { display: grid; gap: 8px; }
.presets button { text-align: left; padding: 10px 14px; border: 3px solid var(--ink); border-radius: 12px; background: #fff; color: var(--ink); font: 700 14px var(--body); cursor: pointer; box-shadow: 0 3px 0 var(--ink); }
.presets button b { display: block; font: 18px var(--display); font-weight: 400; }
.presets button[aria-pressed="true"] { background: #ffe9a8; }
.note { font-size: 12px; color: #5b5168; }
@media (max-height: 440px) { #dist { font-size: 28px; } .pad { transform: scale(.82); transform-origin: bottom; } #meter { bottom: 10px; } }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>

<div id="stage"></div>
<div class="hud" id="tl"><div id="dist">0m</div><div id="sub"></div></div>
<div class="hud" id="tc"><div id="zone"></div><div id="gold"></div></div>
<div class="hud" id="tr"><button class="pill" id="snd" type="button">소리 켬</button><button class="pill" id="menu" type="button">시작 설정</button></div>
<div id="toast"></div>
<div id="meter" hidden><div class="lbl" id="mlbl">스페이스·화면을 꾹 눌렀다 떼서 발사</div><div class="bar"><div class="win" id="mwin"></div><div class="fill" id="mfill"></div></div></div>
<div id="fuel" hidden><i id="fuelR"></i><b id="fuelP"></b></div>
<button class="pad" id="bLeap" type="button" data-key="W" hidden>도약<small></small></button>
<button class="pad" id="bDash" type="button" data-key="E" hidden>대시<small></small></button>
<button class="pad" id="bDive" type="button" data-key="S" hidden>급강하<small></small></button>
<button class="pad" id="bSphx" type="button" data-key="Q" hidden>🔥변신</button>
<button class="pad" id="bBoost" type="button" data-key="Space" hidden>부스트<small></small></button>

<section class="card" id="start">
  <h1>카트 대발사 3D</h1>
  <p>원래 게임과 같은 규칙에 3D 화면을 입힌 시험판입니다. 기록은 원래 게임과 따로 저장돼요. 어떤 카트로 달려 볼까요?</p>
  <div class="presets" id="presets">
    <button type="button" data-p="new" aria-pressed="false"><b>처음부터</b>주차장에서 맨손으로 시작</button>
    <button type="button" data-p="mid" aria-pressed="true"><b>중반 카트</b>업그레이드 절반 · 환생 트리 일부 · 우주까지</button>
    <button type="button" data-p="max" aria-pressed="false"><b>만렙 체험</b>모든 업그레이드·초월 능력 최대 · 미지의 영역 너머</button>
  </div>
  <p class="note">조작: Space 발사·부스트 · W 도약 · E 대시 · S 급강하 · Q 슈퍼 불사조 · A/D 회전. 휴대폰은 화면 버튼과 화면 좌우 터치로 회전.</p>
  <div class="btns"><button class="go alt" id="cont" type="button">이어서 하기</button><button class="go" id="begin" type="button">이 카트로 시작</button></div>
</section>

<section class="card" id="result" hidden>
  <div><h1 id="rWhy"></h1><h2 id="rDist"></h2></div>
  <div class="rows" id="rRows"></div>
  <div class="btns"><button class="go alt" id="rBuy" type="button">모두 업그레이드</button><button class="go" id="rAgain" type="button">다시 밀기</button></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>
(() => {
'use strict';
const C = CORE, $ = s => document.querySelector(s), Z = C.ZONES;
const LS = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };

/* ---------- numbers ---------- */
const UNIT = ['', '만', '억', '조', '경', '해', '자', '양', '구', '간', '정', '재', '극', '항하사', '아승기', '나유타', '불가사의', '무량대수'];
function fmt(n) { n = Math.floor(n); if (!isFinite(n)) return '∞'; if (n < 10000) return n.toLocaleString('ko-KR'); let k = 0; while (n >= 1e72) { n /= 1e68; k++; } let u = 0; while (n >= 10000 && u < UNIT.length - 1) { n /= 10000; u++; }
  return (n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2)) + UNIT[u] + (k ? ' 무량' + ['', '', '²', '³', '⁴'][k] : ''); }
const fmtD = m => m < 1000 ? m.toFixed(1) + 'm' : m < 1e6 ? (m / 1000).toFixed(2) + 'km' : fmt(m / 1000) + 'km';

/* ---------- save (this artifact only) ---------- */
function preset(p) { const s = C.newSave(); if (p === 'new') return s;
  if (p === 'mid') { for (const u of C.UPS) s.lv[u.id] = Math.floor(u.max * 0.5); for (const q of C.PERKS) s.perks[q.id] = Math.ceil(q.max * 0.5); s.rebirths = 6; s.stars = 50; s.starsTotal = s.starsEver = 4000; s.best = s.bestLife = Z[22].at; s.zone = 22; s.zoneEver = 22; return s; }
  for (const u of C.UPS) s.lv[u.id] = u.max; for (const q of C.PERKS) s.perks[q.id] = q.max; for (const q of C.TPERKS) s.tperks[q.id] = q.max; s.rebirths = 30; s.trans = 10; s.starsTotal = s.starsEver = 1e9; s.best = s.bestLife = Z[C.LAST + 60].at; s.zone = C.LAST + 60; s.zoneEver = C.LAST + 60; return s; }
let S = (() => { try { const j = JSON.parse(LS.get('cart3d.save') || 'null'); if (j && j.lv) { const q = Object.assign(C.newSave(), j); C.migrate(q); return q; } } catch (e) {} return null; })();
const save = () => LS.set('cart3d.save', JSON.stringify(S));

/* ---------- renderer ---------- */
const stage = $('#stage'), renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.75)); renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; stage.appendChild(renderer.domElement);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(38, 1, 0.1, 20000);
const hemi = new THREE.HemisphereLight(0xdfefff, 0x5a4630, 0.9); scene.add(hemi);
{ const pm = new THREE.PMREMGenerator(renderer), es = new THREE.Scene(), box = new THREE.Mesh(new THREE.BoxGeometry(10, 10, 10), new THREE.MeshBasicMaterial({ color: 0x8fa6c4, side: THREE.BackSide })); es.add(box);
  for (const [x, y, z, c] of [[0, 4.9, 0, 0xffffff], [4.9, 1, 2, 0xffe2b8], [-4.9, 2, -1, 0xbfd9ff]]) { const l = new THREE.Mesh(new THREE.PlaneGeometry(4, 4), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide })); l.position.set(x, y, z); l.lookAt(0, 0, 0); es.add(l); }
  scene.environment = pm.fromScene(es, 0.04).texture; }
const sun = new THREE.DirectionalLight(0xfff1d6, 2.2); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02; scene.add(sun, sun.target);
scene.fog = new THREE.Fog(0xcfe6ff, 200, 900);
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

/* sky: a vertical gradient per zone, faded between neighbouring zones; stars come out where the sky is dark */
const skyCv = document.createElement('canvas'); skyCv.width = 4; skyCv.height = 256; const skyCtx = skyCv.getContext('2d'), skyTex = new THREE.CanvasTexture(skyCv); skyTex.colorSpace = THREE.SRGBColorSpace; scene.background = skyTex;
const hex = c => new THREE.Color(c);
let skyKey = '';
function paintSky(z) { const zn = Z[Math.min(Z.length - 1, z)], [a, b] = zn.sky || ['#8fc4ff', '#dff1ff'], key = a + b; if (key === skyKey) return; skyKey = key;
  const g = skyCtx.createLinearGradient(0, 0, 0, 256); g.addColorStop(0, a); g.addColorStop(1, b); skyCtx.fillStyle = g; skyCtx.fillRect(0, 0, 4, 256); skyTex.needsUpdate = true;
  scene.fog.color = hex(b); const dark = hex(a).getHSL({}).l < 0.25; stars.visible = dark; hemi.intensity = dark ? 0.55 : 0.9; sun.intensity = dark ? 1.6 : 2.2; }
const stars = (() => { const n = 900, p = new Float32Array(n * 3); for (let i = 0; i < n; i++) { p[i * 3] = (Math.random() - 0.5) * 2600; p[i * 3 + 1] = Math.random() * 900 - 100; p[i * 3 + 2] = -700 - Math.random() * 300; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3)); const m = new THREE.PointsMaterial({ color: 0xffffff, size: 2.2, sizeAttenuation: false, fog: false }); const o = new THREE.Points(g, m); o.visible = false; scene.add(o); return o; })();

/* ---------- materials ---------- */
const M = {
  chrome: new THREE.MeshStandardMaterial({ color: 0xe4e8ef, metalness: 0.75, roughness: 0.3 }),
  redPlastic: new THREE.MeshPhysicalMaterial({ color: 0xe23b2a, roughness: 0.35, clearcoat: 0.6, clearcoatRoughness: 0.2 }),
  rubber: new THREE.MeshStandardMaterial({ color: 0x1d1a22, roughness: 0.85 }),
  hub: new THREE.MeshStandardMaterial({ color: 0x3c8cff, roughness: 0.4, metalness: 0.3 }),
  skin: new THREE.MeshStandardMaterial({ color: 0xffd9b8, roughness: 0.7 }),
  hoodie: new THREE.MeshStandardMaterial({ color: 0x13a493, roughness: 0.8 }),
  pants: new THREE.MeshStandardMaterial({ color: 0x2c3e66, roughness: 0.85 }),
  scarf: new THREE.MeshStandardMaterial({ color: 0xef4a32, roughness: 0.75 }),
  eye: new THREE.MeshStandardMaterial({ color: 0x1d1626, roughness: 0.3 }),
  gold: new THREE.MeshStandardMaterial({ color: 0xffc21f, metalness: 0.55, roughness: 0.3, emissive: 0x8a5600, emissiveIntensity: 0.55 }),
  crate: new THREE.MeshStandardMaterial({ color: 0xc98b3c, roughness: 0.8 }),
  balloon: new THREE.MeshPhysicalMaterial({ color: 0xef4a32, roughness: 0.25, clearcoat: 1, sheen: 0.3 }),
  ring: new THREE.MeshStandardMaterial({ color: 0x14c4ad, roughness: 0.3, metalness: 0.2, emissive: 0x0a6a5e, emissiveIntensity: 0.5 }),
  pad: new THREE.MeshStandardMaterial({ color: 0xff8a1f, roughness: 0.5, emissive: 0x5a2400, emissiveIntensity: 0.4 }),
  tramp: new THREE.MeshStandardMaterial({ color: 0x3f8cff, roughness: 0.4 }),
  rock: new THREE.MeshStandardMaterial({ color: 0x6e6676, roughness: 0.95, flatShading: true }),
  flame: new THREE.MeshBasicMaterial({ color: 0xffa23a, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false }),
  flameCore: new THREE.MeshBasicMaterial({ color: 0xfff1b0, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false }),
  fire: new THREE.MeshBasicMaterial({ color: 0xff7a1a, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }),

const shadowed = o => { o.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } }); return o; };

/* ---------- the cart: a chrome wire basket on four casters, a red handle and a rider in a teal hoodie and red scarf.
   Built in cart units: 1 = basket length; +x = forward (the nose), +y = up, wheels touch y = 0 ---------- */
function makeCart() {
  const cart = new THREE.Group(), body = new THREE.Group(); cart.add(body);
  const bar = (a, b, r = 0.012, mat = M.chrome) => { const d = new THREE.Vector3().subVectors(b, a), len = d.length(), m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 6), mat); m.position.copy(a).addScaledVector(d, 0.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize()); body.add(m); return m; };

  const bx0 = -0.5, bx1 = 0.5, by0 = 0.28, by1 = 0.78, wz0 = 0.26, wz1 = 0.34;
  const corner = (x, y, z) => V(x, y, z);
  for (const s of [-1, 1]) { bar(corner(bx0, by1, s * wz1), corner(bx1 + 0.08, by1, s * wz0 * 1.05), 0.016); bar(corner(bx0, by0, s * wz0), corner(bx1, by0, s * wz0 * 0.9), 0.014); bar(corner(bx0, by0, s * wz0), corner(bx0, by1, s * wz1), 0.016); bar(corner(bx1, by0, s * wz0 * 0.9), corner(bx1 + 0.08, by1, s * wz0 * 1.05), 0.016);
    for (let k = 1; k < 9; k++) { const f = k / 9; bar(corner(bx0 + f * (bx1 - bx0), by0, s * wz0 * (1 - 0.1 * f)), corner(bx0 + f * (bx1 + 0.08 - bx0), by1, s * (wz1 + (wz0 * 1.05 - wz1) * f)), 0.007); }
    for (let k = 1; k < 4; k++) { const f = k / 4, y = by0 + f * (by1 - by0); bar(corner(bx0, y, s * (wz0 + (wz1 - wz0) * f)), corner(bx1 + 0.08 * f, y, s * wz0 * (0.9 + 0.15 * f)), 0.006); } }
  bar(corner(bx0, by1, -wz1), corner(bx0, by1, wz1), 0.016); bar(corner(bx1 + 0.08, by1, -wz0 * 1.05), corner(bx1 + 0.08, by1, wz0 * 1.05), 0.016); bar(corner(bx0, by0, -wz0), corner(bx0, by0, wz0), 0.014); bar(corner(bx1, by0, -wz0 * 0.9), corner(bx1, by0, wz0 * 0.9), 0.014);
  for (let k = 1; k < 8; k++) { const x = bx0 + k / 8 * (bx1 - bx0); bar(corner(x, by0, -wz0), corner(x, by0, wz0), 0.006); }

  const plate = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.012, 0.5), new THREE.MeshStandardMaterial({ color: 0xb9c0cc, metalness: 0.7, roughness: 0.45, transparent: true, opacity: 0.55 })); plate.position.set(0, by0, 0); body.add(plate);
