<meta charset="utf-8">
<title>카트 대발사</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700&display=swap">
<style>
/* Layout: one landscape stage (#root, CSS-rotated in portrait); canvas world + DOM HUD buttons, result card, shop.
   Palette: supermarket flyer — cream paper, price-tag red, cart-handle teal, coin gold. */
:root{
  --paper:#fff6e6; --paper2:#ffe9c7; --ink:#2b2233; --dim:#7a6f80; --red:#f0452f; --teal:#12a594; --gold:#f5b014; --line:#e3cfa6; --lock:#b9ad9a;
  --disp:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif; --body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#1d1a26;color:var(--ink);overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--body)}
#root{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#8fc4ff}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:var(--disp);touch-action:manipulation}
.hbtn{position:absolute;border:3px solid var(--ink);border-radius:50%;background:var(--paper);color:var(--ink);font-size:17px;line-height:1.1;box-shadow:0 5px 0 var(--ink);touch-action:none}
.hbtn:active,.hbtn.down{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.hbtn small{display:block;font:700 11px var(--body);color:var(--dim)}
.hbtn:disabled{opacity:.4}
#boostBtn{right:18px;bottom:20px;width:96px;height:96px;background:var(--red);color:#fff}
#boostBtn small{color:#ffe1d8}
#skillBtn{left:18px;bottom:20px;width:88px;height:88px;background:var(--teal);color:#fff}
#skillBtn small{color:#d3fff7}
#topbar{position:absolute;top:8px;right:10px;display:flex;gap:6px}
.pill{border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:4px 12px;font:15px var(--disp);color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.pill:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100% - 20px);overflow:auto;background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 8px 0 var(--ink);padding:14px 18px}
.card h2{font:26px/1.1 var(--disp);margin:0;color:var(--red)}
.big{font:44px/1 var(--disp);font-variant-numeric:tabular-nums}
.big small{font-size:18px;color:var(--dim)}
.rows{display:grid;grid-template-columns:1fr auto;gap:3px 14px;font-size:13px;margin:8px 0;padding:8px 10px;background:var(--paper2);border-radius:8px;font-variant-numeric:tabular-nums}
.rows b{font-family:var(--disp);font-weight:400;font-size:15px}
.rows .tot{border-top:2px dashed var(--line);padding-top:4px;font:19px var(--disp);color:var(--red)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tagx{background:var(--gold);border:2px solid var(--ink);border-radius:6px;padding:1px 8px;font:13px var(--disp)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.go{height:50px;border:3px solid var(--ink);border-radius:10px;background:var(--red);color:#fff;font-size:21px;box-shadow:0 5px 0 var(--ink)}
.go.alt{background:var(--teal)}
.go.plain{background:var(--paper);color:var(--ink)}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
#shop{position:absolute;inset:0;background:var(--paper);display:grid;grid-template-rows:auto 1fr}
.shead{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:3px solid var(--ink);background:var(--paper2)}
.shead h2{font:24px var(--disp);margin:0;color:var(--red);white-space:nowrap}
.goldv{font:22px var(--disp);font-variant-numeric:tabular-nums;white-space:nowrap}
.goldv::before{content:"";display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--gold);border:2px solid var(--ink);margin-right:6px;vertical-align:-2px}
.zonebar{flex:1;display:flex;gap:3px;min-width:0}
.zonebar i{flex:1;height:10px;border:2px solid var(--ink);border-radius:3px;background:#fff}
.zonebar i.on{background:var(--teal)}
.sbody{display:grid;grid-template-columns:104px 1fr;min-height:0}
.tabs{display:flex;flex-direction:column;gap:6px;padding:10px 8px;border-right:3px solid var(--ink);background:var(--paper2);overflow:auto}
.tab{border:2px solid var(--ink);border-radius:8px;background:var(--paper);font-size:17px;padding:8px 4px;box-shadow:0 3px 0 var(--ink);color:var(--ink)}
.tab.on{background:var(--ink);color:var(--paper);box-shadow:none;transform:translateY(3px)}
.tab small{display:block;font:700 10px var(--body);opacity:.7}
.list{overflow:auto;padding:10px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;align-content:start;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.node{border:2px solid var(--ink);border-radius:10px;background:#fff;padding:7px 9px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;min-width:0}
.node.lock{border-style:dashed;border-color:var(--lock);background:transparent;color:var(--lock)}
.node.max{background:var(--paper2)}
.node h3{font:17px/1.1 var(--disp);margin:0;font-weight:400}
.node h3 span{font:700 11px var(--body);color:var(--teal);margin-left:5px}
.node p{margin:0;font-size:11.5px;line-height:1.35;color:var(--dim);grid-column:1}
.node .eff{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.node .pre{font-size:10.5px;color:var(--lock)}
.buy{grid-row:1/4;grid-column:2;min-width:84px;border:2px solid var(--ink);border-radius:8px;background:var(--gold);color:var(--ink);font-size:15px;padding:7px 6px;box-shadow:0 3px 0 var(--ink);font-variant-numeric:tabular-nums}
.buy:disabled{background:#eee3cf;color:var(--lock);box-shadow:none;border-color:var(--lock)}
.buy:not(:disabled):active{transform:translateY(3px);box-shadow:none}
.buy small{display:block;font:700 10px var(--body)}
.note{grid-column:1/-1;font-size:11.5px;color:var(--dim);line-height:1.5;margin:0}
.note b{color:var(--ink)}
#toast{position:absolute;left:50%;top:16%;transform:translateX(-50%);font:30px var(--disp);color:#fff;text-shadow:0 3px 0 var(--ink),0 0 12px rgba(0,0,0,.4);pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap;text-align:center}
#toast.show{opacity:1}
</style>

<div id="root">
  <canvas id="cv"></canvas>
  <div id="toast"></div>
  <div id="topbar"><button class="pill" id="sndBtn" type="button">소리 켬</button><button class="pill" id="shopBtn" type="button">업그레이드</button></div>
  <button class="hbtn" id="skillBtn" type="button" hidden>도약<small></small></button>
  <button class="hbtn" id="boostBtn" type="button" hidden>부스트<small></small></button>

  <section class="card" id="result" hidden>
    <h2 id="rWhy"></h2>
    <div class="big"><span id="rDist"></span></div>
    <div class="tags" id="rTags"></div>
    <div class="rows" id="rRows"></div>
    <div class="btns"><button class="go alt" id="rShop" type="button">업그레이드</button><button class="go" id="rAgain" type="button">다시 밀기</button></div>
  </section>

  <section id="shop" hidden>
    <div class="shead"><h2>업그레이드</h2><span class="goldv" id="sGold"></span><div class="zonebar" id="sZones"></div><button class="pill" id="sClose" type="button">밀러 가기</button></div>
    <div class="sbody"><div class="tabs" id="sTabs"></div><div class="list" id="sList"></div></div>
  </section>
</div>

<script src="core.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s), C = CORE, Z = C.ZONES;

/* ---------------- save ---------------- */
let S = C.newSave();
try { const j = JSON.parse(localStorage.getItem('cart.save') || 'null'); if (j && j.lv) S = Object.assign(C.newSave(), j); } catch (e) {}
const save = () => { try { localStorage.setItem('cart.save', JSON.stringify(S)); } catch (e) {} };
const UNIT = ['', '만', '억', '조', '경', '해'];
function fmt(n) { n = Math.floor(n); if (n < 10000) return n.toLocaleString('ko-KR'); let u = 0; while (n >= 10000 && u < UNIT.length - 1) { n /= 10000; u++; } return (n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2)) + UNIT[u]; }
const fmtD = m => m < 1000 ? m.toFixed(1) + 'm' : m < 1e6 ? (m / 1000).toFixed(2) + 'km' : fmt(m / 1000) + 'km';

/* ---------------- stage ---------------- */
const root = $('#root'), cv = $('#cv'), g = cv.getContext('2d');
let W = 800, H = 400, portrait = false, DPR = 1;
function layout() { const vw = innerWidth, vh = innerHeight; portrait = vh > vw; W = portrait ? vh : vw; H = portrait ? vw : vh;
  root.style.width = W + 'px'; root.style.height = H + 'px'; root.style.transform = portrait ? `rotate(90deg) translateY(-${H}px)` : 'none';
  DPR = Math.min(devicePixelRatio || 1, 2); cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); }
addEventListener('resize', layout); layout();

/* ---------------- sound (tiny synth blips) ---------------- */
let actx = null, sndOn = true; try { sndOn = localStorage.getItem('cart.snd') !== '0'; } catch (e) {}
const snd = () => { if (!sndOn) return null; if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; actx = new AC(); } if (actx.state === 'suspended') actx.resume(); return actx; };
function tone(f0, f1, dur, vol, type = 'triangle', delay = 0) { const a = snd(); if (!a) return; const t = a.currentTime + delay, o = a.createOscillator(), v = a.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  v.gain.setValueAtTime(0.0001, t); v.gain.exponentialRampToValueAtTime(vol, t + 0.01); v.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(v); v.connect(a.destination); o.start(t); o.stop(t + dur + 0.05); }
function noise(dur, vol, freq) { const a = snd(); if (!a) return; const n = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n); const s = a.createBufferSource(), f = a.createBiquadFilter(), v = a.createGain(); s.buffer = b; f.type = 'lowpass'; f.frequency.value = freq; v.gain.value = vol; s.connect(f); f.connect(v); v.connect(a.destination); s.start(); }
const SFX = { launch: () => { noise(0.5, 0.5, 900); tone(120, 500, 0.35, 0.2, 'sawtooth'); }, bounce: v => { noise(0.12, Math.min(0.5, 0.15 + v), 500); tone(110, 60, 0.12, 0.25, 'sine'); }, coin: () => tone(1320, 1760, 0.09, 0.1), crate: () => [660, 880, 1320].forEach((f, i) => tone(f, f, 0.12, 0.12, 'triangle', i * 0.07)),
  pad: () => tone(300, 900, 0.2, 0.15, 'sawtooth'), tramp: () => tone(200, 700, 0.22, 0.2, 'sine'), ring: () => tone(700, 1400, 0.18, 0.12), bonk: () => { noise(0.15, 0.4, 300); tone(160, 80, 0.15, 0.2, 'square'); }, spring: () => tone(250, 1000, 0.25, 0.2, 'square'),
  dash: () => { noise(0.25, 0.3, 2500); tone(500, 1500, 0.2, 0.12, 'sawtooth'); }, zone: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.2, 0.14, 'triangle', i * 0.09)), buy: () => tone(880, 1320, 0.1, 0.12), splash: () => noise(0.6, 0.5, 700), perfect: () => [784, 1175].forEach((f, i) => tone(f, f, 0.15, 0.14, 'triangle', i * 0.06)) };
const sndBtn = $('#sndBtn'); const sndLabel = () => sndBtn.textContent = sndOn ? '소리 켬' : '소리 끔'; sndLabel();
sndBtn.addEventListener('click', () => { sndOn = !sndOn; try { localStorage.setItem('cart.snd', sndOn ? '1' : '0'); } catch (e) {} sndLabel(); });

/* ---------------- game state ---------------- */
let state = 'aim', st = C.stats(S), run = null, meterT = 0, parts = [], pops = [], shake = 0, banner = null, lastZone = 0, last = performance.now(), boostHeld = false, skillTap = false, pay = null, rot = 0;
const cam = { x: 0, y: 0, vw: 34 };
const boostBtn = $('#boostBtn'), skillBtn = $('#skillBtn');
function toast(t, ms = 1600) { const el = $('#toast'); el.innerHTML = t; el.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('show'), ms); }
function toAim() { st = C.stats(S); run = null; state = 'aim'; meterT = 0; parts = []; pops = []; cam.x = 0; cam.y = 0; cam.vw = 34; rot = -st.angle; $('#result').hidden = true; $('#shop').hidden = true; boostBtn.hidden = skillBtn.hidden = true; $('#topbar').hidden = false; }
const meterVal = () => { const p = (meterT / st.meter) % 2; return p < 1 ? p : 2 - p; };
function launch() {
  const m = meterVal(); run = C.newRun(st, m); state = 'fly'; lastZone = 0; shake = Math.min(14, 4 + run.v0 * 0.05); SFX.launch(); if (run.perfect) { toast('퍼펙트 발사!'); SFX.perfect(); }
  boostBtn.hidden = !st.thrust; skillBtn.hidden = !(st.springN || st.dashN); $('#topbar').hidden = true;
  for (let i = 0; i < 14; i++) parts.push({ x: 0, y: 0.5, vx: -2 - Math.random() * 6, vy: Math.random() * 5, t: 0, life: 0.6, c: '#fff', s: 1 });
}
function endRun() {
  pay = C.finish(run, S); save(); state = 'result'; boostBtn.hidden = skillBtn.hidden = true; $('#topbar').hidden = false;
  $('#rWhy').textContent = run.why; $('#rDist').innerHTML = fmtD(run.maxX);
  const tags = []; if (pay.record) tags.push('신기록'); if (pay.newZone) tags.push(Z[pay.zone].name + ' 첫 도달'); if (run.perfect) tags.push('퍼펙트 발사');
  $('#rTags').innerHTML = tags.map(t => `<span class="tagx">${t}</span>`).join('');
  const rows = [['거리 수익', fmt(pay.dist)], [`코인 · 상자 (${run.coins}개)`, fmt(pay.coins)]];
  if (pay.perfect) rows.push(['퍼펙트 발사', '+10%']); if (pay.style) rows.push([`묘기 (${Math.min(12, run.bounces)}회 튕김)`, '+' + (pay.style * 100).toFixed(1) + '%']); if (pay.alt) rows.push([`고도 수당 (${fmtD(run.maxAlt)})`, '+' + (pay.alt * 100).toFixed(1) + '%']);
  if (pay.first) rows.push(['새 구역 개척 보너스', fmt(pay.first)]);
  $('#rRows').innerHTML = rows.map(r => `<span>${r[0]}</span><b>${r[1]}</b>`).join('') + `<span class="tot">획득 골드</span><b class="tot">${fmt(pay.total)}</b>`;
  $('#result').hidden = false; if (pay.newZone) SFX.zone();
}

/* ---------------- input ---------------- */
cv.addEventListener('pointerdown', e => { e.preventDefault(); snd(); if (state === 'aim') launch(); });
const hold = (el, on, off) => { el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); el.classList.add('down'); on(); try { el.setPointerCapture(e.pointerId); } catch (er) {} }); const up = () => { el.classList.remove('down'); off && off(); }; el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); };
hold(boostBtn, () => boostHeld = true, () => boostHeld = false); hold(skillBtn, () => skillTap = true);
addEventListener('keydown', e => { if (e.repeat) return; if (e.code === 'Space') { if (state === 'aim') launch(); else if (state === 'fly') boostHeld = true; else if (state === 'result') toAim(); } if (e.code === 'ShiftLeft' || e.code === 'KeyS') skillTap = true; });
addEventListener('keyup', e => { if (e.code === 'Space') boostHeld = false; });
document.addEventListener('contextmenu', e => e.preventDefault());
$('#rAgain').addEventListener('click', toAim); $('#rShop').addEventListener('click', openShop); $('#shopBtn').addEventListener('click', openShop); $('#sClose').addEventListener('click', toAim);

/* ---------------- shop ---------------- */
let tab = 'launch', confirmKey = '';
const EFF = { push: s => `발사 ${s.power.toFixed(1)}m/s`, runup: s => `발사 ${s.power.toFixed(1)}m/s`, sling: s => `발사 ${s.power.toFixed(1)}m/s`, cannon: s => `발사 ${s.power.toFixed(1)}m/s`, rail: s => `발사 ${s.power.toFixed(1)}m/s`,
  ramp: s => `각도 ${(s.angle * 180 / Math.PI).toFixed(1)}°`, timing: s => `퍼펙트 ×${s.perfect.toFixed(2)} · 구간 ${(s.window * 100).toFixed(1)}%`, wheel: s => `마찰 ${s.mu.toFixed(3)}`, hover: s => `마찰 ${s.mu.toFixed(4)}`, tire: s => `반발 ${(s.e * 100).toFixed(0)}%`,
  frame: s => `충격 손실 ${(s.loss * 100).toFixed(1)}%`, aero: s => `저항 ${(s.drag * 1000).toFixed(2)}`, bumper: s => s.bumper >= 6 ? '장애물 파괴' : `충돌 후 속도 ${(72 + 4.5 * s.bumper).toFixed(0)}%`, wide: s => `험지 페널티 ${Math.round(Math.max(15, 100 - 8.5 * s.wide))}%`,
  float: s => s.float ? `물 반발 ${(40 + 3.5 * s.float).toFixed(0)}%` : '물에 닿으면 침수', heat: s => `용암 후 속도 ${(55 + 4.4 * s.heat).toFixed(0)}%`, rocket: s => s.thrust ? `추진 ${s.thrust.toFixed(1)}m/s²` : '부스트 없음', jet: s => `추진 ${s.thrust.toFixed(1)}m/s²`, fuel: s => `연료 ${s.fuel.toFixed(2)}초`,
  spring: s => s.springN ? `도약 ${s.springN}회` : '도약 없음', dash: s => s.dashN ? `대시 ${s.dashN}회` : '대시 없음', wing: s => `중력 ${((1 - s.glide) * 100).toFixed(0)}%`, grav: s => `중력 ×${s.grav.toFixed(2)}`, ad: s => `수익 ×${fmt2(s.rate)}`, sponsor: s => `수익 ×${fmt2(s.rate)}`,
  coin: s => `코인 ×${fmt2(s.coin)}`, magnet: s => `범위 +${(s.magnet * 28).toFixed(0)}%`, style: s => `튕김당 +${(s.style * 100).toFixed(2)}%`, alt: s => `고도 계수 ${(s.alt * 100).toFixed(1)}%`, crate: s => `상자 확률 ×${1 + s.crate}` };
const fmt2 = v => v >= 1000 ? fmt(v) : v.toFixed(2);
function openShop() { state = 'shop'; $('#result').hidden = true; $('#shop').hidden = false; boostBtn.hidden = skillBtn.hidden = true; confirmKey = ''; renderShop(); }
function renderShop() {
  st = C.stats(S); $('#sGold').textContent = fmt(S.gold);
  $('#sZones').innerHTML = Z.map((z, i) => `<i class="${i <= S.zone ? 'on' : ''}" title="${z.name}"></i>`).join('');
  $('#sTabs').innerHTML = C.BRANCH.map(([id, name]) => { const us = C.UPS.filter(u => u.br === id), n = us.filter(u => C.canBuy(S, u.id)).length; return `<button type="button" class="tab${tab === id ? ' on' : ''}" data-t="${id}">${name}<small>${n ? '구매 가능 ' + n : us.reduce((a, u) => a + C.lvl(S, u.id), 0) + ' Lv'}</small></button>`; }).join('') +
    `<button type="button" class="tab${tab === 'star' ? ' on' : ''}" data-t="star">재창업<small>★ ${S.stars}</small></button><button type="button" class="tab${tab === 'info' ? ' on' : ''}" data-t="info">기록<small>${S.runs}판</small></button>`;
  const list = $('#sList'); let h = '';
  if (tab === 'star') {
    const gain = C.starsFor(S.bestLife), can = S.bestLife >= Z[4].at;
    h += `<p class="note"><b>재창업</b>을 하면 골드와 업그레이드가 초기화되고, 이번 생의 최고 거리에 따라 <b>★ 별</b>을 받습니다. 별 하나마다 수익 +10%, 발사 속도 +1%가 영구 적용되고, 별로 아래 특전을 살 수 있습니다. ${Z[4].name}(${fmtD(Z[4].at)})에 도달해야 가능합니다.</p>`;
    h += `<div class="node${can ? '' : ' lock'}"><h3>재창업하기</h3><p>이번 생 최고 ${fmtD(S.bestLife)} · 누적 ★ ${S.starsTotal} · ${S.rebirths}회 재창업</p><p class="eff">받을 별 ★ ${gain}</p><button class="buy" data-rebirth="1" ${can && gain > 0 ? '' : 'disabled'}>${confirmKey === 'rebirth' ? '정말요?<small>한 번 더 누르기</small>' : '재창업<small>★ +' + gain + '</small>'}</button></div>`;
    for (const p of C.PERKS) { const l = S.perks[p.id] || 0, mx = l >= p.max, c = C.perkCost(p, l); h += `<div class="node${mx ? ' max' : ''}"><h3>${p.name}<span>Lv ${l}/${p.max}</span></h3><p>${p.desc}</p><p class="eff">보유 ★ ${S.stars}</p><button class="buy" data-perk="${p.id}" ${!mx && S.stars >= c ? '' : 'disabled'}>${mx ? '완료' : '★ ' + c}</button></div>`; }
  } else if (tab === 'info') {
