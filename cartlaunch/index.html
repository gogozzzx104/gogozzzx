<meta charset="utf-8">
<title>카트 대발사</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700&display=swap">
<style>
/* Layout: one landscape stage (#root, CSS-rotated in portrait); canvas world + DOM HUD buttons, result card, shop.
   Palette: supermarket flyer — cream paper, price-tag red, cart-handle teal, coin gold. */
:root{
  --paper:#fff6e6; --paper2:#ffe9c7; --ink:#2b2233; --dim:#7a6f80; --red:#f0452f; --teal:#12a594; --gold:#f5b014; --line:#e3cfa6; --lock:#b9ad9a;
  --disp:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif; --body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#1d1a26;color:var(--ink);overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--body)}
#root{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#8fc4ff}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:var(--disp);touch-action:manipulation}
.hbtn{position:absolute;border:3px solid var(--ink);border-radius:50%;background:var(--paper);color:var(--ink);font-size:17px;line-height:1.1;box-shadow:0 5px 0 var(--ink);touch-action:none}
.hbtn:active,.hbtn.down{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.hbtn small{display:block;font:700 11px var(--body);color:var(--dim)}
.hbtn:disabled{opacity:.4}
#boostBtn{right:18px;bottom:20px;width:96px;height:96px;background:var(--red);color:#fff}
#boostBtn small{color:#ffe1d8}
#skillBtn{left:18px;bottom:20px;width:88px;height:88px;background:var(--teal);color:#fff;font-size:16px;white-space:nowrap}
#skillBtn small{color:#d3fff7}
#dashBtn{left:28px;bottom:122px;width:68px;height:68px;background:#2aa7d8;color:#fff;font-size:15px}
#dashBtn small{color:#dff5ff}
#diveBtn{right:32px;bottom:130px;width:68px;height:68px;background:#8a4dff;color:#fff;font-size:14px}
#diveBtn small{color:#eadcff}
#endBtn{position:absolute;top:8px;right:10px;font-size:13px;padding:3px 10px;opacity:.9}
#topbar{position:absolute;top:8px;right:10px;display:flex;gap:6px}
.pill{border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:4px 12px;font:15px var(--disp);color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.pill:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--ck,1));width:min(560px,calc((100% - 32px) / var(--ck,1)));max-height:calc((100% - 20px) / var(--ck,1));overflow:auto;background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 8px 0 var(--ink);padding:14px 18px}
.card h2{font:26px/1.1 var(--disp);margin:0;color:var(--red)}
.big{font:44px/1 var(--disp);font-variant-numeric:tabular-nums}
.big small{font-size:18px;color:var(--dim)}
.rows{display:grid;grid-template-columns:1fr auto;gap:3px 14px;font-size:13px;margin:8px 0;padding:8px 10px;background:var(--paper2);border-radius:8px;font-variant-numeric:tabular-nums}
.rows b{font-family:var(--disp);font-weight:400;font-size:15px}
.rows .tot{border-top:2px dashed var(--line);padding-top:4px;font:19px var(--disp);color:var(--red)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tagx{background:var(--gold);border:2px solid var(--ink);border-radius:6px;padding:1px 8px;font:13px var(--disp)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.go{height:50px;border:3px solid var(--ink);border-radius:10px;background:var(--red);color:#fff;font-size:21px;box-shadow:0 5px 0 var(--ink)}
.go.alt{background:var(--teal)}
.go.plain{background:var(--paper);color:var(--ink)}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
#shop{position:absolute;left:0;top:0;width:calc(100% / var(--k,1));height:calc(100% / var(--k,1));transform:scale(var(--k,1));transform-origin:0 0;display:grid;grid-template-rows:auto 1fr;color:#efeaff;background:radial-gradient(120% 90% at 25% 0%,#34296a 0%,#1d1740 55%,#120e28 100%)}
#shop::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.5px);background-size:22px 22px}
.shead{position:relative;display:flex;align-items:center;gap:10px;padding:7px 12px;background:linear-gradient(#2a2057,#211945);border-bottom:2px solid #4a3d8a;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.shead h2{font:22px var(--disp);margin:0;color:#ffcf4a;white-space:nowrap;text-shadow:0 2px 0 #0d0a1c}
.goldv{font:20px var(--disp);font-variant-numeric:tabular-nums;white-space:nowrap;background:#0f0b22;border:2px solid #4a3d8a;border-radius:999px;padding:1px 12px 1px 7px;color:#ffe27a}
.goldv::before{content:"";display:inline-block;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#f5b014 60%);border:2px solid #0d0a1c;margin-right:6px;vertical-align:-2px}
#sAll{background:linear-gradient(#7df3da,#12a594)!important}
#shop .pill{background:linear-gradient(#ffd75e,#f5a614);border-color:#0d0a1c;box-shadow:0 3px 0 #0d0a1c;white-space:nowrap}
.zchip{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.zchip b{font:14px var(--disp);font-weight:400;color:#7df3da;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zchip .lvbar{flex:1;min-width:30px;max-width:240px;--bc:#3fe6c5;border:1px solid #4a3d8a;height:8px;box-sizing:border-box}
.sbody{position:relative;display:grid;grid-template-columns:86px 1fr;min-height:0;overflow:hidden}
#sDet{position:absolute;right:0;top:0;bottom:0;width:244px;z-index:6;transform:translateX(106%);transition:transform .16s ease-out;visibility:hidden}
.sbody.det #sDet{transform:none;visibility:visible}
.tree{position:relative;overflow:auto;touch-action:none;min-width:0;scrollbar-width:thin;scrollbar-color:#4a3d8a transparent}
.tw{position:relative}
.edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.edges path{fill:none;stroke:#3a3070;stroke-width:3;stroke-linecap:round}
.edges path.sec{stroke-width:2;stroke-dasharray:1 6}
.edges path.on{stroke:var(--bc)}
.edges rect{fill:#120e28;stroke:#3a3070;stroke-width:1.5}
.edges rect.on{stroke:var(--bc)}
.edges text{font:700 9.5px var(--body);fill:#8176b8;text-anchor:middle}
.edges text.on{fill:#fff}
.nd{position:absolute;width:var(--n,54px);height:var(--n,54px);padding:0;border:0;border-radius:16px;background:linear-gradient(160deg,#3d3275,#251d4b);color:var(--bc);display:grid;place-items:center;box-shadow:0 4px 0 #0d0a1c}
.nd>.ic{width:54%;height:54%;position:relative}
.nd .ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring rect{fill:none;stroke-width:3}
.ring .rt{stroke:#53468f}
.ring .rf{stroke:var(--bc);stroke-linecap:round}
.nd b{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);background:#120e28;border:1.5px solid #53468f;border-radius:8px;padding:0 6px;font:700 10px/14px var(--body);color:#efeaff;white-space:nowrap;font-variant-numeric:tabular-nums}
.nd .bd{position:absolute;right:-7px;top:-7px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;border:2px solid #120e28;box-sizing:content-box}
.nd .bd .ic{width:11px;height:11px;stroke-width:3.2}
.nd span{position:absolute;left:50%;top:calc(100% + 11px);width:var(--cw);transform:translateX(-50%);text-align:center;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:1px}
.nd em{display:inline-block;font:12px/1.12 var(--disp);font-style:normal;color:#e4dcff;word-break:keep-all;background:rgba(18,14,40,.9);border-radius:6px;padding:1px 4px}
.nd u{font:700 10.5px/1.35 var(--body);text-decoration:none;color:#ffe27a;white-space:nowrap;font-variant-numeric:tabular-nums;background:rgba(18,14,40,.9);border-radius:6px;padding:0 5px}
.nd u.poor{color:#8479b8}
.tw.tight .nd span{top:calc(100% + 9px);gap:1px}
.tw.tight .nd em{white-space:nowrap;font-size:11.5px;letter-spacing:-.2px}
.nd.lock{background:#191335;color:#5d5488;box-shadow:none}
.nd.lock .rt{stroke:#3a3070;stroke-dasharray:4 4}
.nd.lock em{color:#7d72ad}
.nd.lock b{color:#8479b8;border-color:#3a3070}
.nd.lock .bd,.nd.gate .bd{background:#3a3070;color:#cfc6f5}
.nd.can{animation:glow 1.5s ease-in-out infinite}
.nd.can .bd{background:#3fe6a0;color:#0d2b1c}
.nd.max{background:linear-gradient(160deg,#77601a,#42340f);color:#ffe27a}
.nd.max .rt,.nd.max .rf{stroke:#ffcf4a}
.nd.max b{border-color:#ffcf4a;color:#ffe27a}
.nd.max .bd{background:#ffcf4a;color:#3d300f}
.nd.sel{outline:3px solid #fff;outline-offset:3px;z-index:2}
@keyframes glow{0%,100%{box-shadow:0 4px 0 #0d0a1c,0 0 0 0 var(--bc)}50%{box-shadow:0 4px 0 #0d0a1c,0 0 14px 3px var(--bc)}}
.bl{position:absolute;transform:translateX(-50%);font:14px var(--disp);color:var(--bc);white-space:nowrap}
.tgrp{position:absolute;border-radius:18px;border:1.5px solid var(--bc);opacity:.28;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0) 60%);pointer-events:none}
.tsum{display:flex;gap:6px;align-items:center;margin:8px 10px 0;position:sticky;left:10px;width:fit-content;z-index:3}
.tsum span,.tsum button{font:700 10.5px/1.5 var(--body);color:#cfc6f5;background:rgba(13,10,28,.6);border:1.5px solid #3a3070;border-radius:999px;padding:2px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tsum button{color:#0d2b1c;background:#3fe6a0;border-color:#0d0a1c}
.dp{overflow:auto;touch-action:none;padding:12px;background:linear-gradient(180deg,#261d52,#161135);border-left:2px solid var(--bc,#4a3d8a);box-shadow:-10px 0 26px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:8px;box-sizing:border-box}
.dh{display:flex;align-items:center;gap:9px}
.di{width:44px;height:44px;flex:none;border-radius:13px;border:2px solid var(--bc);background:linear-gradient(160deg,#3d3275,#251d4b);color:var(--bc);display:grid;place-items:center}
.di .ic{width:60%;height:60%}
.dh h3{font:18px/1.1 var(--disp);margin:0;font-weight:400;color:#fff}
.dh span{font:700 11px var(--body);color:var(--bc);font-variant-numeric:tabular-nums}
.dx{margin-left:auto;align-self:flex-start;width:28px;height:28px;border-radius:8px;border:2px solid #53468f;background:#1b1538;color:#cfc6f5;font:700 13px/1 var(--body);padding:0;flex:none}
.lvbar{height:6px;border-radius:3px;background:#120e28;overflow:hidden}
.lvbar i{display:block;height:100%;border-radius:3px;background:var(--bc,#7df3da)}
.dp p,.pop p{margin:0;font-size:12px;line-height:1.45;color:#cfc6f5}
.pop{position:absolute;width:244px;z-index:5;border:2px solid var(--bc);border-radius:14px;background:linear-gradient(160deg,#322867,#1c1640);box-shadow:0 8px 0 rgba(0,0,0,.45),0 0 22px rgba(0,0,0,.55);padding:10px;display:flex;flex-direction:column;gap:7px;box-sizing:border-box;touch-action:auto}
.eff{background:rgba(255,255,255,.07);border-radius:9px;padding:6px 9px;font-variant-numeric:tabular-nums}
.dp .eff p,.pop .eff p{color:#fff;font-weight:700}
.dp .eff .nx,.pop .eff .nx{color:#7df3da;margin-top:2px}
.eff .nx i{font:700 10px var(--body);font-style:normal;color:#9d92d6;margin-right:6px}
.dr{display:flex;flex-direction:column;gap:3px;margin:0;padding:0;list-style:none}
.dr li{display:flex;align-items:center;gap:6px;font:700 11px var(--body);color:#ff9d9d}
.dr li.ok{color:#7df3da}
.dr li .ic{width:13px;height:13px;stroke-width:3;flex:none}
.dp .brow{margin-top:auto}
.rbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin:8px 10px 0;padding:7px 9px;border:2px solid #9a66ff;border-radius:12px;background:rgba(154,102,255,.13);position:sticky;left:10px;z-index:3}

.chips{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:5px}
.chip{display:flex;flex-direction:column;justify-content:center;padding:3px 10px;border-radius:9px;background:rgba(13,10,28,.55);font:15px/1.15 var(--disp);color:#fff;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip i{font:700 9.5px/1.25 var(--body);font-style:normal;color:#b3a9dd}
.chip.hi{color:#ffe27a}
.rbar .cap{flex-basis:100%;margin:0;font:700 11px var(--body);color:#ffc9c9}
.rbar .buy{flex:none;padding:6px 16px}
.veil{position:relative;height:100%;min-height:250px;overflow:hidden}
.veil .vt{position:absolute;inset:0;filter:blur(7px) saturate(.3) brightness(.55);opacity:.85;pointer-events:none}
.veil .vf{position:absolute;inset:-25%;pointer-events:none;background:radial-gradient(40% 35% at 30% 40%,rgba(160,130,255,.4),transparent 70%),radial-gradient(45% 40% at 70% 60%,rgba(110,90,220,.36),transparent 70%),radial-gradient(35% 30% at 55% 25%,rgba(200,170,255,.26),transparent 70%);animation:fog 13s ease-in-out infinite alternate}
.veil .vf.b{animation-duration:19s;animation-direction:alternate-reverse;opacity:.7}
@keyframes fog{0%{transform:translate(-7%,-3%) scale(1)}100%{transform:translate(7%,4%) scale(1.18)}}
.veil .vc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;padding:16px 28px;border-radius:16px;background:rgba(13,10,28,.62);border:2px solid rgba(197,155,255,.5);box-shadow:0 0 44px rgba(120,90,220,.5)}
.vc>.ic{width:30px;height:30px;color:#c59bff}
.vc h3{margin:0;font:26px/1 var(--disp);font-weight:400;color:#e6d6ff;letter-spacing:.22em;text-indent:.22em}
.vc b{font:21px/1.1 var(--disp);font-weight:400;color:#ffe27a;white-space:nowrap}
.vc .lvbar{width:190px;--bc:#c59bff}
.vc span{font:700 11px var(--body);color:#b3a9dd;white-space:nowrap}
.tab.vl{border-style:dashed;color:#8479b8;letter-spacing:.12em}
@media (prefers-reduced-motion:reduce){.nd.can,.veil .vf{animation:none}#sDet{transition:none}}
.tabs{display:flex;flex-direction:column;gap:5px;padding:8px 6px;background:rgba(0,0,0,.28);border-right:2px solid #4a3d8a;overflow:auto}
.tab{position:relative;display:flex;align-items:center;gap:5px;border:2px solid #4a3d8a;border-radius:10px;background:linear-gradient(#2e2560,#221a48);color:#cfc6f5;font-size:15px;padding:4px 6px;flex:none;box-shadow:0 3px 0 #0d0a1c;text-align:left;white-space:nowrap}
.tab .ic{width:20px;height:20px;flex:none;color:var(--bc)}
.tab.on{background:var(--bc);color:#17122e;border-color:#fff;box-shadow:none;transform:translateY(3px)}
.tab.on .ic{color:#17122e}
.tab i{position:absolute;top:-5px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:#ff5a5a;color:#fff;font:700 10px/16px var(--body);text-align:center;font-style:normal;padding:0 3px;box-sizing:border-box}
.buy{border:2px solid #0d0a1c;border-radius:10px;background:linear-gradient(#ffd75e,#f5a614);color:#2b2233;font:17px var(--disp);padding:8px 6px;box-shadow:0 4px 0 #0d0a1c;font-variant-numeric:tabular-nums}
.buy small{display:block;font:700 10px var(--body)}
.buy:disabled{background:#2a2350;color:#7d72b5;box-shadow:none;border-color:#3b3170}
.buy:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 #0d0a1c}
.buy.star{background:linear-gradient(#d3b3ff,#9a66ff);color:#fff}
.buy.star:disabled{background:#2a2350;color:#7d72b5}
.buy.auto{background:linear-gradient(#a8f7e6,#2fbfa3);color:#10302b}.buy.auto.on{background:linear-gradient(#7df3da,#12a594);color:#fff;box-shadow:0 0 10px rgba(125,243,218,.6)}.buy.auto:disabled{background:#1f3a40;color:#6fa39a}
.buy.sm{font-size:13px;padding:8px 10px}
.brow{display:grid;grid-template-columns:1fr auto;gap:6px}
.rb{border:2px solid #9a66ff;border-radius:12px;padding:8px;background:rgba(154,102,255,.12);display:flex;flex-direction:column;gap:5px}
.rb h3{font:17px var(--disp);margin:0;font-weight:400;color:#e6d6ff}
.tree.grid{padding:10px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:7px;align-content:start}
.bh{grid-column:1/-1;font:17px var(--disp);margin:6px 0 -2px;color:#ffcf4a;display:flex;align-items:center;gap:8px}
.bh::after{content:"";flex:1;height:2px;background:#3b3170}
.ac{border:2px solid #53468f;border-radius:10px;background:linear-gradient(160deg,#30275e,#221a45);padding:6px 9px;min-width:0;display:flex;flex-direction:column;gap:2px}
.ac h3{font:15px/1.15 var(--disp);margin:0;font-weight:400;color:#fff}
.ac p{margin:0;font-size:11px;line-height:1.35;color:#b3a9dd}
.ac.off{border-style:dashed;border-color:#3b3170;background:transparent}
.ac.off h3{color:#7d72b5}
.ac.off p{color:#5f558f}
.ac.done{border-color:#ffcf4a}
.ac.done h3::before{content:"★ ";color:#ffcf4a}
.ac h3 .ic{width:13px;height:13px;vertical-align:-1px;margin-right:4px}
.ac.tc{gap:4px}
.ac.tc h3{display:flex;align-items:baseline;gap:6px}
.ac.tc h3 small{margin-left:auto;font:700 10.5px var(--body);color:#7df3da;white-space:nowrap}
.ac.tc .lvbar{--bc:#7df3da;height:5px}
.ac .tv{color:#fff;font-weight:700;font-variant-numeric:tabular-nums}
.ac.tc .buy{margin-top:auto}
.note{grid-column:1/-1;font-size:11.5px;color:#b3a9dd;line-height:1.5;margin:0}
.sk{border:2px solid #53468f;border-radius:12px;background:linear-gradient(160deg,#30275e,#221a45);color:#fff;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;font:15px var(--disp)}
.sk canvas{width:110px;height:70px;background:linear-gradient(#8fc4ff,#dff1ff);border-radius:8px}
.sk small{font:700 10px var(--body);color:#b3a9dd}
.sk.on{border-color:#ffcf4a;box-shadow:0 0 12px rgba(255,207,74,.5)}
.sk.lock{opacity:.5;border-style:dashed}
.tabs.many{gap:4px;padding:6px}
.tabs.many .tab{padding:2px 6px}
.tree.mapt{overflow:hidden}
.mapv{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;box-sizing:border-box;padding:8px 0}
.film{position:relative;width:100%;height:var(--fh);flex:none;perspective:1000px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);cursor:grab;touch-action:none}
.film:active{cursor:grabbing}
.fc{position:absolute;left:50%;top:0;width:var(--cw);height:var(--fh);margin-left:calc(var(--cw) / -2);box-sizing:border-box;padding:23px 7px 15px;background-color:#0a0910;background-image:linear-gradient(90deg,rgba(214,206,240,.6) 0 9px,transparent 9px),linear-gradient(90deg,rgba(214,206,240,.6) 0 9px,transparent 9px);background-size:20px 6px,20px 6px;background-position:5px 4px,5px calc(100% - 4px);background-repeat:repeat-x;backface-visibility:hidden;will-change:transform}
.fp{position:relative;width:100%;height:100%;border-radius:5px;overflow:hidden;background:#000;box-shadow:0 0 0 1.5px #24212e}
.fp canvas{display:block;width:100%;height:100%;pointer-events:none}
.fp.q{display:grid;place-items:center}
.fp.q b{font:400 calc(var(--cw) * .2)/1 var(--disp);color:#5d5869;letter-spacing:.08em}
.fn{position:absolute;left:9px;top:11px;font:700 8.5px/1 var(--body);font-style:normal;color:#f5b014;letter-spacing:.12em;pointer-events:none}
.mcap{text-align:center;min-height:44px}
.mcap h3{margin:0;font:22px/1.15 var(--disp);font-weight:400;color:#fff}
.mcap p{margin:3px 0 0;font:700 11.5px/1.3 var(--body);color:#b3a9dd;font-variant-numeric:tabular-nums}
.mcap b{color:#ffcf4a;font-weight:700}
