<meta charset="utf-8">
<title>카트 대발사</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700&display=swap">
<style>
/* Layout: one landscape stage (#root, CSS-rotated in portrait); canvas world + DOM HUD buttons, result card, shop.
   Palette: supermarket flyer — cream paper, price-tag red, cart-handle teal, coin gold. */
:root{
  --paper:#fff6e6; --paper2:#ffe9c7; --ink:#2b2233; --dim:#7a6f80; --red:#f0452f; --teal:#12a594; --gold:#f5b014; --line:#e3cfa6; --lock:#b9ad9a;
  --disp:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif; --body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#1d1a26;color:var(--ink);overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:var(--body)}
#root{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#8fc4ff}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:var(--disp);touch-action:manipulation}
.hbtn{position:absolute;border:3px solid var(--ink);border-radius:50%;background:var(--paper);color:var(--ink);font-size:17px;line-height:1.1;box-shadow:0 5px 0 var(--ink);touch-action:none}
.hbtn:active,.hbtn.down{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.hbtn small{display:block;font:700 11px var(--body);color:var(--dim)}
.hbtn:disabled{opacity:.4}
#boostBtn{right:18px;bottom:20px;width:96px;height:96px;background:var(--red);color:#fff}
#boostBtn small{color:#ffe1d8}
#skillBtn{left:18px;bottom:20px;width:88px;height:88px;background:var(--teal);color:#fff;font-size:16px;white-space:nowrap}
#skillBtn small{color:#d3fff7}
#dashBtn{left:28px;bottom:122px;width:68px;height:68px;background:#2aa7d8;color:#fff;font-size:15px}
#dashBtn small{color:#dff5ff}
#diveBtn{right:32px;bottom:130px;width:68px;height:68px;background:#8a4dff;color:#fff;font-size:14px}
#diveBtn small{color:#eadcff}
#endBtn{position:absolute;top:8px;right:10px;font-size:13px;padding:3px 10px;opacity:.9}
#topbar{position:absolute;top:8px;right:10px;display:flex;gap:6px}
.pill{border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:4px 12px;font:15px var(--disp);color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.pill:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--k,1));width:min(560px,calc((100% - 32px) / var(--k,1)));max-height:calc((100% - 20px) / var(--k,1));overflow:auto;background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:0 8px 0 var(--ink);padding:14px 18px}
.card h2{font:26px/1.1 var(--disp);margin:0;color:var(--red)}
.big{font:44px/1 var(--disp);font-variant-numeric:tabular-nums}
.big small{font-size:18px;color:var(--dim)}
.rows{display:grid;grid-template-columns:1fr auto;gap:3px 14px;font-size:13px;margin:8px 0;padding:8px 10px;background:var(--paper2);border-radius:8px;font-variant-numeric:tabular-nums}
.rows b{font-family:var(--disp);font-weight:400;font-size:15px}
.rows .tot{border-top:2px dashed var(--line);padding-top:4px;font:19px var(--disp);color:var(--red)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tagx{background:var(--gold);border:2px solid var(--ink);border-radius:6px;padding:1px 8px;font:13px var(--disp)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.go{height:50px;border:3px solid var(--ink);border-radius:10px;background:var(--red);color:#fff;font-size:21px;box-shadow:0 5px 0 var(--ink)}
.go.alt{background:var(--teal)}
.go.plain{background:var(--paper);color:var(--ink)}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
#shop{position:absolute;left:0;top:0;width:calc(100% / var(--k,1));height:calc(100% / var(--k,1));transform:scale(var(--k,1));transform-origin:0 0;display:grid;grid-template-rows:auto 1fr;color:#efeaff;background:radial-gradient(120% 90% at 25% 0%,#34296a 0%,#1d1740 55%,#120e28 100%)}
#shop::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.5px);background-size:22px 22px}
.shead{position:relative;display:flex;align-items:center;gap:10px;padding:7px 12px;background:linear-gradient(#2a2057,#211945);border-bottom:2px solid #4a3d8a;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.shead h2{font:22px var(--disp);margin:0;color:#ffcf4a;white-space:nowrap;text-shadow:0 2px 0 #0d0a1c}
.goldv{font:20px var(--disp);font-variant-numeric:tabular-nums;white-space:nowrap;background:#0f0b22;border:2px solid #4a3d8a;border-radius:999px;padding:1px 12px 1px 7px;color:#ffe27a}
.goldv::before{content:"";display:inline-block;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#f5b014 60%);border:2px solid #0d0a1c;margin-right:6px;vertical-align:-2px}
.zonebar{flex:1;display:flex;gap:3px;min-width:0}
.zonebar i{flex:1;height:8px;border-radius:4px;background:#0f0b22;border:1px solid #4a3d8a}
.zonebar i.on{background:linear-gradient(#5af0d0,#12a594);border-color:#5af0d0}
#shop .pill{background:linear-gradient(#ffd75e,#f5a614);border-color:#0d0a1c;box-shadow:0 3px 0 #0d0a1c;white-space:nowrap}
.sbody{position:relative;display:grid;grid-template-columns:86px 1fr;min-height:0}
#sDet{display:none}
.sbody.wide{grid-template-columns:86px 1fr}
.sbody.wide #sDet{display:none}
.tabs{display:flex;flex-direction:column;gap:5px;padding:8px 6px;background:rgba(0,0,0,.28);border-right:2px solid #4a3d8a;overflow:auto}
.tab{position:relative;display:flex;align-items:center;gap:5px;border:2px solid #4a3d8a;border-radius:10px;background:linear-gradient(#2e2560,#221a48);color:#cfc6f5;font-size:15px;padding:5px 6px;box-shadow:0 3px 0 #0d0a1c;text-align:left;white-space:nowrap}
.tab .ic{width:20px;height:20px;flex:none;color:var(--bc)}
.tab.on{background:var(--bc);color:#17122e;border-color:#fff;box-shadow:none;transform:translateY(3px)}
.tab.on .ic{color:#17122e}
.tab i{position:absolute;top:-5px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:#ff5a5a;color:#fff;font:700 10px/16px var(--body);text-align:center;font-style:normal;padding:0 3px;box-sizing:border-box}
.tree{position:relative;overflow:auto;touch-action:none;min-width:0}
.tw{position:relative;min-height:100%}
.edges{position:absolute;inset:0;pointer-events:none}
.edges path{fill:none;stroke:#3b3170;stroke-width:3;stroke-linejoin:round}
.edges path.on{stroke:var(--bc);opacity:.85}
.edges text{font:700 9px var(--body);fill:#7d72b5}
.edges text.on{fill:#fff}
.nd{position:absolute;border-radius:14px;border:2px solid #53468f;background:linear-gradient(160deg,#3a2f6e,#241c47);color:var(--bc);display:grid;place-items:center;box-shadow:0 4px 0 #0d0a1c;padding:0}
.nd .ic{width:58%;height:58%}
.nd b{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);background:#0f0b22;border:1.5px solid #53468f;border-radius:8px;padding:0 5px;font:700 10px/14px var(--body);color:#efeaff;white-space:nowrap}
.nd span{position:absolute;left:50%;top:calc(100% + 11px);width:var(--cw);transform:translateX(-50%);text-align:center}
.nd em{display:block;font:11.5px/1.1 var(--disp);font-style:normal;color:#cfc6f5;word-break:keep-all}
.nd.lock{border-style:dashed;color:#6d6399;background:#1b1538;box-shadow:none}
.nd.lock em{color:#6d6399}
.nd u{display:block;margin-top:2px;font:700 10.5px var(--body);text-decoration:none;color:#ffe27a;white-space:nowrap}
.nd u.poor{color:#8479b8}
.pop{position:absolute;width:236px;z-index:5;border:2px solid var(--bc);border-radius:14px;background:linear-gradient(160deg,#322867,#1c1640);box-shadow:0 8px 0 rgba(0,0,0,.45),0 0 22px rgba(0,0,0,.55);padding:10px;display:flex;flex-direction:column;gap:7px;box-sizing:border-box}
.pop p{margin:0;font-size:12px;line-height:1.4;color:#cfc6f5}
.pop .eff{color:#fff;font-weight:700;background:rgba(255,255,255,.08);border-radius:8px;padding:5px 8px;font-variant-numeric:tabular-nums}
.rbar{display:flex;align-items:center;gap:10px;margin:8px 10px 0;padding:7px 10px;border:2px solid #9a66ff;border-radius:12px;background:rgba(154,102,255,.14)}
.rbar div{flex:1;min-width:0}
.rbar h3{font:16px var(--disp);margin:0;font-weight:400;color:#e6d6ff}
.rbar p{margin:0;font-size:11.5px;color:#cfc6f5;line-height:1.35}
.rbar .buy{flex:none;padding:6px 16px}
.nd.can{border-color:var(--bc);animation:glow 1.4s ease-in-out infinite}
.nd.max{border-color:#ffcf4a;background:linear-gradient(160deg,#6a5416,#3d300f);color:#ffe27a}
.nd.max b{border-color:#ffcf4a;color:#ffe27a}
.nd.sel{outline:3px solid #fff;outline-offset:2px}
@keyframes glow{0%,100%{box-shadow:0 4px 0 #0d0a1c,0 0 0 0 var(--bc)}50%{box-shadow:0 4px 0 #0d0a1c,0 0 12px 2px var(--bc)}}
.bl{position:absolute;transform:translateX(-50%);font:14px var(--disp);color:var(--bc);white-space:nowrap}
.dp{position:relative;overflow:auto;touch-action:none;padding:10px;background:rgba(8,5,22,.5);border-left:2px solid #4a3d8a;display:flex;flex-direction:column;gap:7px;min-width:0}
.dh{display:flex;align-items:center;gap:9px}
.di{width:46px;height:46px;flex:none;border-radius:12px;border:2px solid var(--bc);background:linear-gradient(160deg,#3a2f6e,#241c47);color:var(--bc);display:grid;place-items:center}
.di .ic{width:62%;height:62%}
.dh h3{font:19px/1.1 var(--disp);margin:0;font-weight:400;color:#fff}
.dh span{font:700 11px var(--body);color:var(--bc)}
.dp p{margin:0;font-size:12px;line-height:1.4;color:#cfc6f5}
.dp .eff{color:#fff;font-weight:700;background:rgba(255,255,255,.07);border-radius:8px;padding:5px 8px;font-variant-numeric:tabular-nums}
.dr{display:flex;flex-wrap:wrap;gap:4px}
.dr span{font:700 10.5px var(--body);border-radius:6px;padding:2px 6px;background:rgba(255,90,90,.18);color:#ff9d9d}
.dr span.ok{background:rgba(90,240,208,.15);color:#7df3da}
.buy{border:2px solid #0d0a1c;border-radius:10px;background:linear-gradient(#ffd75e,#f5a614);color:#2b2233;font:17px var(--disp);padding:8px 6px;box-shadow:0 4px 0 #0d0a1c;font-variant-numeric:tabular-nums}
.buy small{display:block;font:700 10px var(--body)}
.buy:disabled{background:#2a2350;color:#7d72b5;box-shadow:none;border-color:#3b3170}
.buy:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 #0d0a1c}
.buy.star{background:linear-gradient(#d3b3ff,#9a66ff);color:#fff}
.buy.sm{font-size:13px;padding:8px 10px}
.brow{display:grid;grid-template-columns:1fr auto;gap:6px}
.rb{border:2px solid #9a66ff;border-radius:12px;padding:8px;background:rgba(154,102,255,.12);display:flex;flex-direction:column;gap:5px}
.rb h3{font:17px var(--disp);margin:0;font-weight:400;color:#e6d6ff}
.tree.grid{padding:10px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:7px;align-content:start}
.bh{grid-column:1/-1;font:17px var(--disp);margin:6px 0 -2px;color:#ffcf4a;display:flex;align-items:center;gap:8px}
.bh::after{content:"";flex:1;height:2px;background:#3b3170}
.ac{border:2px solid #53468f;border-radius:10px;background:linear-gradient(160deg,#30275e,#221a45);padding:6px 9px;min-width:0;display:flex;flex-direction:column;gap:2px}
.ac h3{font:15px/1.15 var(--disp);margin:0;font-weight:400;color:#fff}
.ac p{margin:0;font-size:11px;line-height:1.35;color:#b3a9dd}
.ac.off{border-style:dashed;border-color:#3b3170;background:transparent}
.ac.off h3{color:#7d72b5}
.ac.off p{color:#5f558f}
.ac.done{border-color:#ffcf4a}
.ac.done h3::before{content:"★ ";color:#ffcf4a}
.note{grid-column:1/-1;font-size:11.5px;color:#b3a9dd;line-height:1.5;margin:0}
.sk{border:2px solid #53468f;border-radius:12px;background:linear-gradient(160deg,#30275e,#221a45);color:#fff;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;font:15px var(--disp)}
.sk canvas{width:110px;height:70px;background:linear-gradient(#8fc4ff,#dff1ff);border-radius:8px}
.sk small{font:700 10px var(--body);color:#b3a9dd}
.sk.on{border-color:#ffcf4a;box-shadow:0 0 12px rgba(255,207,74,.5)}
.sk.lock{opacity:.5;border-style:dashed}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic .f{fill:currentColor;stroke:none}
#toast{position:absolute;left:50%;top:33%;transform:translateX(-50%);font:30px var(--disp);color:#fff;text-shadow:0 3px 0 var(--ink),0 0 12px rgba(0,0,0,.4);pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap;text-align:center}
#toast.show{opacity:1}
.kb .hbtn::after{content:attr(data-key);position:absolute;top:-6px;right:-2px;background:#2b2233;color:#fff;font:700 11px sans-serif;padding:2px 7px;border-radius:9px;pointer-events:none}
</style>

<div id="root">
  <canvas id="cv"></canvas>
  <div id="toast"></div>
  <div id="topbar"><button class="pill" id="sndBtn" type="button">소리 켬</button><button class="pill" id="shopBtn" type="button">업그레이드</button></div>
  <button class="hbtn" id="skillBtn" type="button" data-key="W" hidden>도약<small></small></button>
  <button class="hbtn" id="dashBtn" type="button" data-key="E" hidden>대시<small></small></button>
  <button class="hbtn" id="diveBtn" type="button" data-key="S" hidden>급강하<small></small></button>
  <button class="pill" id="endBtn" type="button" hidden>결과 보기</button>
  <button class="hbtn" id="boostBtn" type="button" data-key="Space" hidden>부스트<small></small></button>

  <section class="card" id="result" hidden>
    <h2 id="rWhy"></h2>
    <div class="big"><span id="rDist"></span></div>
    <div class="tags" id="rTags"></div>
    <div class="rows" id="rRows"></div>
    <div class="btns"><button class="go alt" id="rShop" type="button">업그레이드</button><button class="go" id="rAgain" type="button">다시 밀기</button></div>
  </section>

  <section id="shop" hidden>
    <div class="shead"><h2>업그레이드</h2><span class="goldv" id="sGold"></span><div class="zonebar" id="sZones"></div><button class="pill" id="sClose" type="button">밀러 가기</button></div>
    <div class="sbody"><div class="tabs" id="sTabs"></div><div class="tree" id="sList"></div><div class="dp" id="sDet"></div></div>
  </section>
</div>

<script src="core.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s), C = CORE, Z = C.ZONES;

/* ---------------- save ---------------- */
let S = C.newSave();
try { const j = JSON.parse(localStorage.getItem('cart.save') || 'null'); if (j && j.lv) { S = Object.assign(C.newSave(), j); S.v = j.v; C.migrate(S); } } catch (e) {}   // older saves are converted by the core
const save = () => { try { localStorage.setItem('cart.save', JSON.stringify(S)); } catch (e) {} };
if (S.migrated != null) { const n = S.migrated; delete S.migrated; save(); setTimeout(() => toast(`밸런스 대개편! 업그레이드·골드는 초기화되고${n ? ' 보상으로 ★ ' + n + '개를 받았어요' : ', 별·환생 트리·업적은 그대로예요'}`, 5000), 800); }
const UNIT = ['', '만', '억', '조', '경', '해'];
function fmt(n) { n = Math.floor(n); if (n < 10000) return n.toLocaleString('ko-KR'); let u = 0; while (n >= 10000 && u < UNIT.length - 1) { n /= 10000; u++; } return (n >= 100 ? n.toFixed(0) : n >= 10 ? n.toFixed(1) : n.toFixed(2)) + UNIT[u]; }
const fmtD = m => m < 1000 ? m.toFixed(1) + 'm' : m < 1e6 ? (m / 1000).toFixed(2) + 'km' : fmt(m / 1000) + 'km';

/* ---------------- stage ---------------- */
const root = $('#root'), cv = $('#cv'); let g = cv.getContext('2d');
let W = 800, H = 400, portrait = false, DPR = 1, uiK = 1;
function layout() { const vw = innerWidth, vh = innerHeight; portrait = vh > vw; W = portrait ? vh : vw; H = portrait ? vw : vh; uiK = Math.max(1, Math.min(2.2, W / 940, H / 470)); root.style.setProperty('--k', uiK.toFixed(3));
  root.style.width = W + 'px'; root.style.height = H + 'px'; root.style.transform = portrait ? `rotate(90deg) translateY(-${H}px)` : 'none';
  DPR = Math.min(devicePixelRatio || 1, 2); cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR); }
addEventListener('resize', layout); layout();

/* ---------------- sound (tiny synth blips) ---------------- */
let actx = null, sndMode = 0, sndOn = true, musOn = true; try { sndMode = +(localStorage.getItem('cart.snd2') || (localStorage.getItem('cart.snd') === '0' ? 2 : 0)); } catch (e) {} sndOn = sndMode < 2; musOn = sndMode === 0;   // 0 sound+music · 1 effects only · 2 off
const snd = () => { if (!sndOn) return null; if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; actx = new AC(); } if (actx.state === 'suspended') actx.resume(); return actx; };
function tone(f0, f1, dur, vol, type = 'triangle', delay = 0) { const a = snd(); if (!a) return; const t = a.currentTime + delay, o = a.createOscillator(), v = a.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  v.gain.setValueAtTime(0.0001, t); v.gain.exponentialRampToValueAtTime(vol, t + 0.01); v.gain.exponentialRampToValueAtTime(0.0001, t + dur); o.connect(v); v.connect(a.destination); o.start(t); o.stop(t + dur + 0.05); }
function noise(dur, vol, freq) { const a = snd(); if (!a) return; const n = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n); const s = a.createBufferSource(), f = a.createBiquadFilter(), v = a.createGain(); s.buffer = b; f.type = 'lowpass'; f.frequency.value = freq; v.gain.value = vol; s.connect(f); f.connect(v); v.connect(a.destination); s.start(); }
const SFX = { launch: () => { noise(0.5, 0.5, 900); tone(120, 500, 0.35, 0.2, 'sawtooth'); }, bounce: v => { noise(0.12, Math.min(0.5, 0.15 + v), 500); tone(110, 60, 0.12, 0.25, 'sine'); }, coin: () => tone(1320, 1760, 0.09, 0.1), crate: () => [660, 880, 1320].forEach((f, i) => tone(f, f, 0.12, 0.12, 'triangle', i * 0.07)),
  pad: () => tone(300, 900, 0.2, 0.15, 'sawtooth'), tramp: () => tone(200, 700, 0.22, 0.2, 'sine'), ring: () => tone(700, 1400, 0.18, 0.12), bonk: () => { noise(0.15, 0.4, 300); tone(160, 80, 0.15, 0.2, 'square'); }, spring: () => tone(250, 1000, 0.25, 0.2, 'square'),
  dash: () => { noise(0.25, 0.3, 2500); tone(500, 1500, 0.2, 0.12, 'sawtooth'); }, zone: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.2, 0.14, 'triangle', i * 0.09)), buy: () => tone(880, 1320, 0.1, 0.12), splash: () => noise(0.6, 0.5, 700), perfect: () => [784, 1175].forEach((f, i) => tone(f, f, 0.15, 0.14, 'triangle', i * 0.06)) };
const sndBtn = $('#sndBtn'); const sndLabel = () => sndBtn.textContent = ['소리·음악 켬', '효과음만', '소리 끔'][sndMode]; sndLabel();
sndBtn.addEventListener('click', () => { sndMode = (sndMode + 1) % 3; sndOn = sndMode < 2; musOn = sndMode === 0; try { localStorage.setItem('cart.snd2', String(sndMode)); } catch (e) {} sndLabel(); snd(); });
